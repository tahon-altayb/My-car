plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.launcher'
    compileSdk 33

    defaultConfig {
        applicationId 'com.example.launcher'
        // رواديو 8227L تعرض 8.1 لكن نظامها الفعلي غالباً أقدم، فننزل الحد الأدنى
        minSdk 21
        targetSdk 27
        versionCode 13
        versionName '0.13'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}
